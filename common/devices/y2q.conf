# Samsung Galaxy S20+ 5G -- a port in progress (see docs/PORTING.md). The UEFI port follows Mu-Silicium's
# r8q (Galaxy S20 FE, the same SoC): uefi/files/Platforms/Samsung/y2qPkg.
NAME="Samsung Galaxy S20+ 5G (y2q, SM-G986N)"
KIND=phone
SOC="Qualcomm Snapdragon 865 (SM8250)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# Samsung has no fastboot: out/y2q-boot.img goes to the boot partition from TWRP (keep a backup of the
# original boot image -- it holds Android's kernel and Magisk). XL_DEVICE=y2q ./xl enter does that, after
# asking; ./xl restore-boot FILE puts the backup back.
BOOT_VIA=twrp
UEFI_TARGET=y2q
UEFI_FD=                        # a built SILICIUM_UEFI.fd; empty: Mu-Silicium/Build/y2qPkg/... (no prebuilt for y2q)
DTB=uefi/files/Resources/DTBs/y2q.dtb   # from the phone (/sys/firmware/fdt), board-id 14, PVR Rev05
FD_BASE=0x9FC00000              # "UEFI FD" in the phone's own uefiplat.cfg and in r8q.toml
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000         # free DDR on the 12 GB board; xnuloader/loader.c has it hard-coded too

# --- kernel and loader -----------------------------------------------------------------------------
FB_BASE=0x9C000000              # "Display Reserved" / cont_splash_region; 1440 x 3200 (S6E3HAB, default timing wqhd60) -- TODO: check
WIFI_ATH11K=0                   # QCA6390 on PCIe (pcie0 @ 0x1c00000): needs a PCIe host driver first

# --- what the run needs ----------------------------------------------------------------------------
# Start with no extras: framebuffer only. Touch (sec_ts @ i2c 0x994000, addr 0x48, IRQ TLMM 15) needs a
# driver before touchscreen=1 means anything here.
BOOTARGS="cpus=8"
DEFAULT_SECS=300
# Mesa for the window server (gpu=1 draws with it on the Adreno 650)
USERLAND_VARS="GL=1"
# Adreno 650: a650_{sqe.fw,gmu.bin,zap.*} from /vendor/firmware, kept in fw-gpu/
FIRMWARE=""
# The boot without the computer (xl autoboot-image / install-autoboot): the kernel on the biggest core while
# the loader serves the flash from the first (ufs=2), the root the iOS volume in darwin, no time limit;
# what iOS writes kept in darwin past the volume and the cryptexes (var_store=1 ufs_write=1: saved at
# power-off, on the five-finger hold, and every ten minutes; put back at the next boot); the GPU started
# and kept for CoreAnimation (gpu=1, images built with GL=1); the battery and the charger read from the
# MAX77705 (max77705=1: bsd/dev/redwood_max77705.c); the Wi-Fi brought up beside the start (wifi=1: the
# BCM4375 and brcmfmac, docs/y2q-wifi.md), joining fw/network if the images have it
AUTOBOOT_ARGS="cpus=8 bootcpu=7 touchscreen=1 ufs=2 root_apfs=ufs_darwin sb_delay=8 var_store=1 ufs_write=1 gpu=1 max77705=1 wifi=1"
